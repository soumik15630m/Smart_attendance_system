name: ci

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # numpy is pinned <2.0 for AI-stack compatibility; 3.13 wheels for that
    # range are not guaranteed, so treat 3.13 as experimental rather than
    # blocking the pipeline on it.
    continue-on-error: ${{ matrix.python-version == '3.13' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Quality Tools
        run: |
          pip install ruff bandit mypy pip-audit vulture types-requests types-redis
          ruff --version
          bandit --version

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Linter (Ruff)
        run: ruff check --extend-select I .

      - name: Check Formatting
        run: ruff format --check .

      - name: Run Type Checker (Mypy)
        run: mypy . --ignore-missing-imports

      - name: Run Security Check (Bandit)
        run: bandit -r src/ -ll

      - name: Run Dependency Audit
        run: pip-audit -r requirements.txt

      - name: Detect Dead Code (Vulture)
        run: vulture src/ --min-confidence 80

      - name: Check Dependency Lists Are In Sync
        run: python scripts/check_deps_sync.py

      - name: Test Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/test_db
        run: |
          alembic upgrade head
          alembic downgrade base

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    continue-on-error: ${{ matrix.python-version == '3.13' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/test_db
        run: alembic upgrade head

      - name: Run Tests With Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/test_db
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml

  build:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: smart-attendance:test
          outputs: type=docker,dest=/tmp/myimage.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/myimage.tar
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Load Image For Smoke Test
        run: docker load -i /tmp/myimage.tar

      - name: Smoke Test Container
        run: |
          docker network create smoke-net
          docker run -d --name smoke-postgres --network smoke-net \
            -e POSTGRES_USER=user -e POSTGRES_PASSWORD=password -e POSTGRES_DB=test_db \
            pgvector/pgvector:pg16
          docker run -d --name smoke-redis --network smoke-net redis:7-alpine
          for i in $(seq 1 30); do
            docker exec smoke-postgres pg_isready -U user && break
            sleep 1
          done

          docker run -d --name smoke-app --network smoke-net -p 8000:8000 \
            -e DATABASE_URL=postgresql+asyncpg://user:password@smoke-postgres:5432/test_db \
            -e REDIS_HOST=smoke-redis \
            -e AUTO_START_LOCAL_REDIS=false \
            -e DEBUG=true \
            smart-attendance:test

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health/

          docker logs smoke-app
          docker rm -f smoke-app smoke-postgres smoke-redis
          docker network rm smoke-net