[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-attendance-system"
version = "1.0.0"
description = "Face Recognition Attendance System with Anti-Spoofing & Edge AI"
authors = [
    { name="Soumik", email="soumik15630m@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.17.0",
    "opencv-python>=4.9.0",
    "numpy<2.0.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "tomli>=2.0.0; python_version < \"3.11\"",
    # Security pins (transitive deps with known CVEs) - keep in sync with requirements.txt
    "jaraco.context>=6.1.0",
    "msgpack>=1.2.1",
    "setuptools>=78.1.1",
    "wheel>=0.46.2"
]

[project.scripts]
start-attendance-server = "src.main:start"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends() idiom requires calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"scripts/camera_client.py" = ["E402"]  # warnings.filterwarnings() must run before the noisy onnxruntime/insightface imports

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Must match the fixture loop scope above. Our DB engine's connection pool
# is created once at import time; if test *functions* ran on the default
# per-function loop while the pool's connections were opened on the
# session loop, checking out a pooled connection in a later test would
# hand asyncpg a connection bound to a different event loop and raise
# "Future attached to a different loop". Keeping both scopes at "session"
# ensures every test reuses the same loop the pool was created on.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]